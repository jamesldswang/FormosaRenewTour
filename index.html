<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FormosaRenewTour — Medical & Aesthetic Travel in Taiwan</title>
  <meta name="description" content="Private tours of Taiwan combined with world-class medical care, health checks and aesthetic treatments at Taiwan's top hospitals.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Text is filled from lang/*.js by data-i18n keys (data-i18n-html allows <br>). -->
  <header class="nav">
    <div class="container nav-inner">
      <a href="#top" class="logo">Formosa<span>Renew</span>Tour</a>
      <div class="nav-right">
        <nav class="nav-links">
          <a href="#packages" data-i18n="nav.tours"></a>
          <a href="#destinations" data-i18n="nav.places"></a>
          <a href="#why" data-i18n="nav.why"></a>
          <a href="#aesthetics" data-i18n="nav.aesthetics"></a>
          <a href="#hospitals" data-i18n="nav.hospitals"></a>
          <a href="#how" data-i18n="nav.how"></a>
          <a href="#faq" data-i18n="nav.faq"></a>
          <a href="#contact" class="btn btn-small" data-i18n="nav.cta"></a>
        </nav>
        <label class="lang-switch" title="Language / 語言 / 语言">
          <span aria-hidden="true">🌐</span>
          <select id="lang-select" aria-label="Language"></select>
        </label>
        <button class="menu-btn" aria-label="Open menu" aria-expanded="false">☰</button>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- HERO -->
    <section class="hero">
      <div class="container hero-inner">
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 data-i18n-html="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="hero-cta">
          <a href="#contact" class="btn" data-i18n="hero.cta1"></a>
          <a href="#packages" class="btn btn-ghost" data-i18n="hero.cta2"></a>
        </div>
        <ul class="hero-badges">
          <li><strong data-i18n="hero.b1n"></strong> <span data-i18n="hero.b1"></span></li>
          <li><strong data-i18n="hero.b2n"></strong> <span data-i18n="hero.b2"></span></li>
          <li><strong data-i18n="hero.b3n"></strong> <span data-i18n="hero.b3"></span></li>
        </ul>
      </div>
    </section>

    <!-- PACKAGES -->
    <section id="packages" class="section">
      <div class="container">
        <p class="eyebrow" data-i18n="pkg.eyebrow"></p>
        <h2 data-i18n="pkg.title"></h2>
        <p class="section-lead" data-i18n="pkg.lead"></p>
        <div class="filters" id="pkg-filters">
          <button class="chip active" data-tag="All" data-i18n="filter.all"></button>
          <button class="chip" data-tag="Travel" data-i18n="tag.Travel"></button>
          <button class="chip" data-tag="Medical" data-i18n="tag.Medical"></button>
          <button class="chip" data-tag="Aesthetic" data-i18n="tag.Aesthetic"></button>
          <button class="chip" data-tag="Dental" data-i18n="tag.Dental"></button>
        </div>
        <div class="grid cards" id="pkg-grid"></div>
      </div>
    </section>

    <!-- DESTINATIONS -->
    <section id="destinations" class="section alt">
      <div class="container">
        <p class="eyebrow" data-i18n="dest.eyebrow"></p>
        <h2 data-i18n="dest.title"></h2>
        <p class="section-lead" data-i18n="dest.lead"></p>
        <div class="filters" id="dest-filters">
          <button class="chip active" data-pace="All" data-i18n="filter.all"></button>
          <button class="chip" data-pace="Easy" data-i18n="paceChip.Easy"></button>
          <button class="chip" data-pace="Moderate" data-i18n="paceChip.Moderate"></button>
          <button class="chip" data-pace="Active" data-i18n="paceChip.Active"></button>
        </div>
        <div class="grid dest" id="dest-grid"></div>
      </div>
    </section>

    <!-- TRAVEL ESSENTIALS -->
    <section id="essentials" class="section">
      <div class="container">
        <p class="eyebrow" data-i18n="ess.eyebrow"></p>
        <h2 data-i18n="ess.title"></h2>
        <div class="grid ess" id="ess-grid"></div>
      </div>
    </section>

    <!-- WHY TAIWAN -->
    <section id="why" class="section alt">
      <div class="container">
        <p class="eyebrow" data-i18n="why.eyebrow"></p>
        <h2 data-i18n="why.title"></h2>
        <p class="section-lead" data-i18n="why.lead"></p>
        <div class="grid stats" id="stats-grid"></div>

        <h3 class="sub" data-i18n="why.sub"></h3>
        <div class="table-wrap">
          <table class="price-table">
            <thead><tr><th data-i18n="th.item"></th><th data-i18n="th.taiwan"></th><th data-i18n="th.usd"></th><th data-i18n="th.note"></th></tr></thead>
            <tbody id="price-body"></tbody>
          </table>
        </div>
        <p class="fineprint" data-i18n="why.fine"></p>
      </div>
    </section>

    <!-- AESTHETICS -->
    <section id="aesthetics" class="section">
      <div class="container">
        <p class="eyebrow" data-i18n="aes.eyebrow"></p>
        <h2 data-i18n="aes.title"></h2>
        <p class="section-lead" data-i18n="aes.lead"></p>
        <div class="grid aes" id="aes-grid"></div>
      </div>
    </section>

    <!-- HOSPITALS -->
    <section id="hospitals" class="section alt">
      <div class="container">
        <p class="eyebrow" data-i18n="hosp.eyebrow"></p>
        <h2 data-i18n="hosp.title"></h2>
        <div class="filters">
          <select id="h-region" aria-label="Region"></select>
          <select id="h-tag" aria-label="Specialty"></select>
        </div>
        <div class="grid hosp" id="hosp-grid"></div>
        <p class="fineprint" data-i18n="hosp.fine"></p>
      </div>
    </section>

    <!-- HOW IT WORKS -->
    <section id="how" class="section">
      <div class="container">
        <p class="eyebrow" data-i18n="how.eyebrow"></p>
        <h2 data-i18n="how.title"></h2>
        <ol class="steps">
          <li><span>1</span><h4 data-i18n="how.s1t"></h4><p data-i18n="how.s1"></p></li>
          <li><span>2</span><h4 data-i18n="how.s2t"></h4><p data-i18n="how.s2"></p></li>
          <li><span>3</span><h4 data-i18n="how.s3t"></h4><p data-i18n="how.s3"></p></li>
          <li><span>4</span><h4 data-i18n="how.s4t"></h4><p data-i18n="how.s4"></p></li>
          <li><span>5</span><h4 data-i18n="how.s5t"></h4><p data-i18n="how.s5"></p></li>
        </ol>
        <div class="roles">
          <div><h4 data-i18n="how.r1t"></h4><p data-i18n="how.r1"></p></div>
          <div><h4 data-i18n="how.r2t"></h4><p data-i18n="how.r2"></p></div>
        </div>
      </div>
    </section>

    <!-- FAQ -->
    <section id="faq" class="section alt">
      <div class="container narrow">
        <p class="eyebrow" data-i18n="faq.eyebrow"></p>
        <h2 data-i18n="faq.title"></h2>
        <div id="faq-list"></div>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="section contact">
      <div class="container narrow">
        <p class="eyebrow" data-i18n="contact.eyebrow"></p>
        <h2 data-i18n="contact.title"></h2>
        <p class="section-lead" data-i18n="contact.lead"></p>
        <form id="contact-form">
          <div class="row">
            <label><span data-i18n="form.name"></span><input name="name" required></label>
            <label><span data-i18n="form.email"></span><input type="email" name="email" required></label>
          </div>
          <div class="row">
            <label><span data-i18n="form.country"></span><input name="country"></label>
            <label><span data-i18n="form.interest"></span>
              <select name="interest" id="interest"></select>
            </label>
          </div>
          <div class="row">
            <label><span data-i18n="form.month"></span><input type="month" name="month"></label>
            <label><span data-i18n="form.travelers"></span><input type="number" name="travelers" min="1" value="1"></label>
          </div>
          <label><span data-i18n="form.message"></span><textarea name="message" rows="4"></textarea></label>
          <button class="btn" type="submit" data-i18n="form.submit"></button>
          <p class="form-note" id="form-note"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <div class="logo">Formosa<span>Renew</span>Tour</div>
        <p data-i18n="footer.tagline"></p>
      </div>
      <div>
        <h5 data-i18n="footer.explore"></h5>
        <a href="#packages" data-i18n="nav.tours"></a>
        <a href="#destinations" data-i18n="nav.places"></a>
        <a href="#essentials" data-i18n="nav.essentials"></a>
        <a href="#hospitals" data-i18n="nav.hospitals"></a>
        <a href="#faq" data-i18n="nav.faq"></a>
      </div>
      <div>
        <h5 data-i18n="footer.official"></h5>
        <a href="https://www.medicaltravel.org.tw" target="_blank" rel="noopener" data-i18n="footer.mohw"></a>
        <a href="https://www.taiwan.net.tw" target="_blank" rel="noopener" data-i18n="footer.tourism"></a>
        <a href="https://www.boca.gov.tw" target="_blank" rel="noopener" data-i18n="footer.boca"></a>
      </div>
    </div>
    <div class="container disclaimer">
      <p><span data-i18n="footer.disclaimer"></span> © <span id="year"></span> FormosaRenewTour · <span id="version"></span></p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="lang/en.js"></script>
  <script src="lang/zh-Hant.js"></script>
  <script src="lang/zh-Hans.js"></script>
  <script src="app.js"></script>
</body>
</html>
